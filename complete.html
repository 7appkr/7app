<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 검색엔진 직접 접속에 의한 잘못된 전환 측정 방지 -->
    <meta name="robots" content="noindex, nofollow">
    <title>7APP - 의뢰 접수 완료</title>


    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18381690833"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'AW-18381690833');
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Paperozi', 'sans-serif'] },
                    colors: {
                        primary: '#6B46C1', 
                        secondary: '#4299E1',
                        dark: '#0F172A',
                        darker: '#090E17',
                    }
                }
            }
        }
    </script>

    <style>
        @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2'); font-weight: 900; font-display: swap; }

        body { font-family: 'Paperozi', sans-serif; word-break: keep-all; background-color: #F8FAFC; }
    </style>
</head>
<body class="text-slate-800 antialiased relative min-h-screen flex flex-col justify-between">

    <!-- 헤더 -->
    <header class="fixed w-full top-0 z-50 bg-dark/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-center">
            <a href="https://7app.kr" class="flex items-center gap-2 text-white font-black text-xl tracking-tight">
                <div class="w-6 h-6 bg-white rotate-45 rounded-sm"></div>
                7APP
            </a>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="pt-32 pb-16 flex-grow flex items-center justify-center px-4">
        <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-12 text-center relative overflow-hidden">
            
            <!-- 상단 그래픽/아이콘 -->
            <div class="w-24 h-20 mx-auto mb-4 relative flex items-center justify-center">
                <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center shadow-inner">
                    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>

            <!-- 메인 메시지 -->
            <span class="inline-block py-1 px-4 rounded-full bg-blue-50 text-blue-600 text-xs font-bold mb-3">
                개발 의뢰 접수 완료
            </span>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-800 mb-4 tracking-tight">
                시안 선택 및 의뢰가<br>성공적으로 접수되었습니다!
            </h1>
            <p class="text-slate-500 text-sm sm:text-base leading-relaxed mb-8">
                선택하신 시안으로 개발 준비가 시작되었습니다.<br>
                <strong class="text-slate-700">무통장 입금 확인 후 바로 본 작업에 착수</strong>합니다.
            </p>

            <!-- 결제/계좌 정보 안내 박스 -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-6 text-left mb-8 space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    입금 계좌 안내
                </h3>
                <div class="flex justify-between items-center text-sm border-b border-slate-200/60 pb-2">
                    <span class="text-slate-500 font-medium">은행 / 예금주</span>
                    <span class="font-bold text-slate-800">카카오뱅크 (이효연)</span>
                </div>
                <div class="flex justify-between items-center text-sm pt-1">
                    <span class="text-slate-500 font-medium">계좌번호</span>
                    <div class="flex items-center gap-2">
                        <span class="font-mono font-black text-blue-600 text-base">3333-00-1234567</span>
                        <button type="button" onclick="copyAccount()" class="px-2.5 py-1 bg-white border border-slate-200 rounded-md text-xs font-bold text-slate-600 hover:bg-slate-100 transition shadow-sm">
                            복사
                        </button>
                    </div>
                </div>
            </div>

            <!-- 하단 버튼 -->
            <a href="https://7app.kr" class="inline-block w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-black text-lg py-4 rounded-xl hover:opacity-95 transition shadow-lg shadow-indigo-500/25">
                메인 페이지로 이동
            </a>

            <!-- 문의 안내 -->
            <p class="mt-6 text-xs text-slate-400">
                입금 확인 문의: <a href="mailto:7app.kr@gmail.com" class="text-blue-500 font-bold hover:underline">7app.kr@gmail.com</a>
            </p>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-dark text-slate-400 py-6 border-t border-slate-800 text-center text-xs">
        <p>© 7APP. All rights reserved.</p>
    </footer>

    <script>
        function copyAccount() {
            navigator.clipboard.writeText('3333001234567').then(() => {
                alert('계좌번호가 복사되었습니다.');
            });
        }
    </script>
</body>
</html>
